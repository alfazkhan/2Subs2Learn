<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>2Subs2Learn Dashboard</title>
    <link rel="stylesheet" href="popup.css">
</head>
<body>
    <div class="container">
        <div class="header-row">
            <h2>2Subs2Learn <span id="toolbar-pct" style="font-size: 11px; color: #EE964B;">(0% Ready)</span></h2>
            <button id="pin-btn" title="Pin / Open in separate tab">📌</button>
        </div>
        
        <div class="settings-group">
            <h3>Settings</h3>
            <div class="settings-row">
                <span>Translate from</span>
                <select id="source-lang">
                    <option value="en">English</option>
                    <option value="de">German</option>
                </select>
            </div>
            <div class="settings-row">
                <span>Translate to</span>
                <select id="target-lang">
                    <option value="de" selected>German</option>
                    <option value="en">English</option>
                </select>
            </div>
            <div class="settings-row swap-container">
                <button id="swap-btn">Swap Languages ⇄</button>
            </div>
        </div>

        <div class="settings-group">
            <h3>Display Mode</h3>
            <div class="button-group">
                <button class="display-btn active" data-value="target">Target Primary</button>
                <button class="display-btn" data-value="source">Source Primary</button>
            </div>
        </div>

        <div class="settings-group">
            <h3>YouTube Embedded Toolbar</h3>
            <div class="settings-row">
                <span>Show Toolbar on Page</span>
                <input type="checkbox" id="embedded-toggle" checked>
            </div>
        </div>

        <div class="settings-group">
            <h3>Performance Tuning</h3>
            <div class="settings-row">
                <label>Batch Size:</label>
                <input type="number" id="batch-size" value="10" min="1" max="50">
            </div>
            <div class="settings-row">
                <label>Prefetch Offset:</label>
                <input type="number" id="prefetch-offset" value="3" min="1" max="10">
            </div>
        </div>

        <div id="log-container"></div>
    </div>
    <script src="popup.js"></script>
</body>
</html>
